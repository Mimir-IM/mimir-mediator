[package]
name = "mimir-mediator"
version = "0.3.6"
edition = "2024"

[dependencies]
ygg_stream = { git = "https://github.com/Revertron/ygg_stream", tag = "v0.2.7" }
turso = { version = "0.7.0", default-features = false, features = ["mimalloc"] }
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
getopts = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
hex = "0.4"

[[bin]]
name = "stress_test"
path = "src/bin/stress_test.rs"